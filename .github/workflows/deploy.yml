name: Build and publish to docs/

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Copy build output into docs/
        run: |
          rm -rf docs
          cp -r dist docs
          test -f docs/CNAME || { echo "CNAME missing from build output"; exit 1; }
          test -f docs/index.html || { echo "index.html missing from build output"; exit 1; }

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No change in build output — nothing to publish."
          else
            git commit -m "Publish: rebuild docs/ from ${GITHUB_SHA::7}"
            git push
          fi
